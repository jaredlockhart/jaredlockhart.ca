AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  jaredlockhart.ca over HTTPS - CloudFront in front of the existing jaredlockhart.ca S3 website bucket.
  The bucket itself (public static-website hosting, created by hand in 2020) isn't managed here.

Parameters:
  DomainName:
    Type: String
    Default: ''
    Description: Apex domain (jaredlockhart.ca). Leave empty to use only the cloudfront.net address.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate in us-east-1 covering DomainName and www.DomainName (see certificate.yaml).
  WebsiteEndpoint:
    Type: String
    Default: jaredlockhart.ca.s3-website-us-east-1.amazonaws.com

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  # Sends www.<domain> to the apex domain so there's one canonical address.
  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-www-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to apex
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host && request.headers.host.value;
          if (host && host.indexOf('www.') === 0) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://' + host.slice(4) + request.uri } }
            };
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: jaredlockhart.ca
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If
          - HasDomain
          - [!Ref DomainName, !Sub 'www.${DomainName}']
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        # The S3 website endpoint (rather than the bucket's REST endpoint) serves index.html for
        # directory paths; it only speaks HTTP, so CloudFront terminates HTTPS in front of it.
        Origins:
          - Id: s3-website
            DomainName: !Ref WebsiteEndpoint
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: s3-website
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirectFunction.FunctionMetadata.FunctionARN

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
